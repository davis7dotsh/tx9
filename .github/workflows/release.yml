name: release

# Tag-push CI for tx9's distribution (docs/tx9-cli-design.md decision 10):
# push a `v*` tag, get cross-compiled binaries + checksums.txt attached to
# a GitHub release that `internal/selfupdate` (via `tx9 upgrade`) and
# scripts/install.sh both know how to consume.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: Install shellcheck
        # Pinned to match .depot/workflows/check.yml and local dev, so a
        # release build never fails a check that `make check` passed
        # locally for a different reason (older/newer shellcheck).
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # `make check` (syntax + shellcheck + static contracts + guest-script
      # regressions + go-check) needs no Docker daemon and no network
      # access: none of tests/*.sh shell out to `docker` (checked — they
      # only grep the repo's Docker-related source files/strings), so
      # nothing here is trimmed down; the full local gate runs unmodified
      # before a release is ever built.
      - name: make check
        run: make check

      - name: Derive VERSION from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build dist/ (cross-compiled binaries + checksums.txt)
        run: make dist VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
