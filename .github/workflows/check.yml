name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  make-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq
      - name: make check
        run: make check
