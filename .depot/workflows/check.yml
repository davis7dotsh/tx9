# Depot CI Migration
# Source: .github/workflows/check.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  make-check:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        # `make check` now runs go-check (gofmt/vet/build/test on the tx9
        # CLI); keep this in sync with go.mod's `go` directive.
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
      - name: Install shellcheck
        # Pinned instead of apt's (often much older) package: older shellcheck
        # versions flag `[[ cond ]] && cmd || true` as SC2015, a check that
        # current shellcheck deliberately doesn't apply to `[[ ]]` tests. Pin
        # to match what local development already runs against.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: make check
        run: make check
