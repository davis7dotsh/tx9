name: check
on:
  push:
    branches: [main]
  # Include PRs against other branches so every layer of a PR stack is checked.
  pull_request:
permissions:
  contents: read
jobs:
  make-check:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
      - name: Install shellcheck
        # Pinned instead of apt's (often much older) package: older shellcheck
        # versions flag `[[ cond ]] && cmd || true` as SC2015, a check that
        # current shellcheck deliberately doesn't apply to `[[ ]]` tests. Pin
        # to match what local development already runs against.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: make check
        run: make check
  site-check:
    runs-on: depot-ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
